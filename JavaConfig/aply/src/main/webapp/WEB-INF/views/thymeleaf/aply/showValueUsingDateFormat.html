<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{thymeleaf/layout/template :: layout(~{::head/content()},~{::body/content()})}">
    <head> </head>
    <body>
        <div class="container">
            <div id="wrapper">
                <h1 id="screenTitle">モデルに格納された値を日付フォーマット表示した画面</h1>

                <ul th:if="${testcaseId} == 'APLY1001005'">
                    <li id="message1">Thymeleafが提供している#temporals.formatを利用して数値を以下に表示します。</li>
                    <li id="message2" th:text="${#temporals.format(valueUsingDateFormat,'yyyy/MM/dd')}"></li>
                </ul>
                <ul th:if="${testcaseId} == 'APLY1001027'">
                    <li id="message1">Thymeleafが提供している#temporals.arrayFormatを利用して数値を以下に表示します。</li>
                    <li id="message2">
                        <span th:each="date, status : ${#temporals.arrayFormat(valueUsingDateFormat,'yyyy/MM/dd')}" th:text="${status.last}? ${date} : |${date}, |" th:remove="tag"></span>
                    </li>
                </ul>
                <ul th:if="${testcaseId} == 'APLY1001028'">
                    <li id="message1">Thymeleafが提供している#temporals.listFormatを利用して数値を以下に表示します。</li>
                    <li id="message2">
                        <span th:each="date, status : ${#temporals.listFormat(valueUsingDateFormat,'yyyy/MM/dd')}" th:text="${status.last}? ${date} : |${date}, |" th:remove="tag"></span>
                    </li>
                </ul>
                <ul th:if="${testcaseId} == 'APLY1001029'">
                    <li id="message1">Thymeleafが提供している#temporals.setFormatを利用して数値を以下に表示します。</li>
                    <li id="message2"><span th:each="date, status : ${#temporals.setFormat(valueUsingDateFormat,'yyyy/MM/dd')}" th:text="${status.last}? ${date} : |${date}, |" th:remove="tag"></span></li>
                </ul>
            </div>
        </div>
    </body>
</html>
